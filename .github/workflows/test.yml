name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  # known-vulnerability scan of both lock files (the app's and the AI server's), dev dependencies included;
  # any advisory fails the run. Actions are pinned to commit SHAs (the tag is in the comment).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm audit --audit-level=low
      - run: npm audit --audit-level=low
        working-directory: server

  # a small browser subset on every push (owner, 2026-10-15): typing, the lost edit, deal persistence and the
  # deal export, on Chromium at iPhone size. The full suite, WebKit and the LibreOffice recalc stay in
  # npm run check:full.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt
      - run: pip install -r tests/e2e/requirements.txt
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.56.1
      - if: steps.pw.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: bash tests/e2e/run.sh typing-flow lostedit-flow deal-persistence deal-export
        env:
          E2E_SKIP_RECALC: '1'
