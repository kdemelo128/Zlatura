name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  # a small browser subset on every push (owner, 2026-10-15): typing, the lost edit, deal persistence and the
  # deal export, on Chromium at iPhone size. The full suite, WebKit and the LibreOffice recalc stay in
  # npm run check:full.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt
      - run: pip install -r tests/e2e/requirements.txt
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1
      - uses: actions/cache@v4
        id: pw
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.56.1
      - if: steps.pw.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: bash tests/e2e/run.sh typing-flow lostedit-flow deal-persistence deal-export
        env:
          E2E_SKIP_RECALC: '1'
