<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stand-in filler</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Invented+Sans&display=swap">
<link rel="stylesheet" href="style.css">
<style>body { margin: 0; font-family: sans-serif; } .tiny { font-size: 12px; }</style>
</head>
<body>
<main id="stand">
  <h1 id="stand-title">Stand-in filler</h1>
  <p class="tiny" id="stand-when"></p>
  <label>Scenario <select id="stand-scn" onchange="window.standInline = true"><option>Base</option><option>Upside</option></select></label>
  <button id="stand-coin" type="button">Add a coin</button>
  <output id="stand-coins">0</output>
  <button id="stand-example" type="button">Load the example</button>
  <button id="stand-probe" type="button">Probe the policy</button>
  <output id="stand-probe-out"></output>
  <pre id="stand-out"></pre>
  <canvas id="stand-canvas" width="120" height="40" aria-label="Invented chart"></canvas>
</main>
<script src="filler.js"></script>
<script src="ui.js"></script>
</body>
</html>
