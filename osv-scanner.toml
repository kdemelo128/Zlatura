# osv-scanner config, read by the CI `dependencies` job (osv-scanner finds it next to the scanned lock file).
# Every entry needs a reason and an ignoreUntil date so an exception cannot become permanent.
# Process and removal steps: docs/security-checklist.md, "Time-boxed advisory exceptions".

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
# 60 days from 2026-10-30. Remove sooner as soon as exceljs/archiver/glob stop pulling minimatch 3.1.5 and 5.1.9.
ignoreUntil = 2026-12-29
reason = "minimatch 3.1.5 and 5.1.9 are reachable only through the devDependency exceljs 4.4.0 -> archiver 5.3.2 (glob 7.2.3, readdir-glob 1.1.3). Never shipped (the app serves the vendored ExcelJS bundle) and never given untrusted patterns. The fix is minimatch 11.x, which is BlueOak-1.0.0 licensed (outside our permissive list) and would need the owner's approval."
